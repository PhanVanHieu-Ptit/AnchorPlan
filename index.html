<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AnchorPlan</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #1a1a2e; }
    #toolbar {
      position: fixed; top: 0; left: calc((100% - 268px) / 2); transform: translateX(-50%);
      display: flex; flex-direction: row; gap: 8px;
      background: rgba(10,10,30,0.88); padding: 8px 14px;
      border-radius: 0 0 10px 10px; z-index: 20; pointer-events: auto;
    }
    #sidebar {
      position: fixed; right: 0; top: 0;
      width: 268px; height: 100vh; overflow-y: auto;
      background: #12121f; color: #fff;
      font-size: 13px; padding: 14px;
      font-family: system-ui; z-index: 15;
      box-sizing: border-box;
    }
    .device-row:hover { background: rgba(255,255,255,0.05); }
    .del-btn:hover { opacity: 0.9 !important; }
    .ctx-item { padding: 6px 14px; cursor: pointer; }
    .ctx-item:hover { background: rgba(255,255,255,0.08); }

    .catalog-card {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 10px; border-radius: 8px;
      cursor: grab; color: #fff; font-size: 12px;
      border: 1.5px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      user-select: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .catalog-card:hover { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.2); }
    .catalog-card:active { cursor: grabbing; }
    .catalog-card.dragging { opacity: 0.45; cursor: grabbing; }

    #drag-cursor {
      position: fixed; pointer-events: none; z-index: 9999;
      display: none; font-size: 26px;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.8));
    }
    #drop-hint {
      position: fixed; pointer-events: none; z-index: 5;
      display: none; left: 0; top: 0;
      width: calc(100% - 268px); height: 100%;
      border: 2px solid rgba(55,138,221,0.35);
    }
    #drop-hint.active { display: block; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    document.addEventListener('DOMContentLoaded', () => {

      // ── RENDERER ──
      const SIDEBAR_W = 268;
      const canvasW = () => window.innerWidth - SIDEBAR_W;

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(canvasW(), window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const css2dRenderer = new CSS2DRenderer();
      css2dRenderer.setSize(canvasW(), window.innerHeight);
      css2dRenderer.domElement.style.position = 'absolute';
      css2dRenderer.domElement.style.top = '0';
      css2dRenderer.domElement.style.left = '0';
      css2dRenderer.domElement.style.pointerEvents = 'none';
      document.body.appendChild(css2dRenderer.domElement);

      window.addEventListener('resize', () => {
        camera.aspect = canvasW() / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(canvasW(), window.innerHeight);
        css2dRenderer.setSize(canvasW(), window.innerHeight);
      });

      // ── SCENE ──
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050a12);
      scene.add(new THREE.AmbientLight(0x0a1a2e, 0.4));
      const dirLight = new THREE.DirectionalLight(0xb0c8ff, 0.7);
      dirLight.position.set(15, 25, 10);
      scene.add(dirLight);
      const warmLight = new THREE.PointLight(0xff6b35, 0.5, 30);
      warmLight.position.set(-8, 5, -5);
      scene.add(warmLight);

      // ── GROUND PLANE ──
      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(20, 64),
        new THREE.MeshStandardMaterial({ color: 0x020810, roughness: 0.9, metalness: 0.1 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -0.1;
      scene.add(ground);

      // ── CAMERA ──
      const camera = new THREE.PerspectiveCamera(50, canvasW() / window.innerHeight, 0.1, 1000);
      camera.position.set(20, 26, 20);
      camera.lookAt(0, 10, 0);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;

      // ── BUILDING ──
      const FLOORS = 10;
      const FLOOR_HEIGHT = 3.2;
      const SLAB_H = 0.28;
      const wallH = FLOOR_HEIGHT - SLAB_H;
      window.floors = [];

      // ── DEVICE TYPES ──
      const DEVICE_TYPES = [
        // ── CAMERAS (có hướng + góc quét — xem Prompt C) ──
        { id:'cam_fixed',  label:'Fixed Camera',  color:'#378ADD', icon:'📷',
          category:'camera', hasFOV: true,  fovAngle: 90,  fovRange: 6  },
        { id:'cam_ptz',    label:'PTZ Camera',    color:'#5B9BF0', icon:'🔄',
          category:'camera', hasFOV: true,  fovAngle: 120, fovRange: 8  },
        { id:'cam_dome',   label:'Dome Camera',   color:'#85B7EB', icon:'⚫',
          category:'camera', hasFOV: true,  fovAngle: 180, fovRange: 5  },
        // ── SENSORS ──
        { id:'motion',     label:'Motion Sensor', color:'#1D9E75', icon:'〰',
          category:'sensor', hasFOV: false },
        { id:'smoke',      label:'Smoke Detector',color:'#EF9F27', icon:'💨',
          category:'sensor', hasFOV: false },
        { id:'temp',       label:'Temp Monitor',  color:'#D4537E', icon:'🌡',
          category:'sensor', hasFOV: false },
        // ── INFRASTRUCTURE ──
        { id:'ac',         label:'AC Unit',       color:'#888780', icon:'❄',
          category:'infra', hasFOV: false },
        { id:'alarm',      label:'Fire Alarm',    color:'#E24B4A', icon:'🔔',
          category:'infra', hasFOV: false },
      ];
      let activeTypeId = 'cam_fixed';
      let deviceIdCounter = 1;
      window.devices = [];

      function floorColor(i, total) {
        const t = i / (total - 1);
        const h = 200 + t * 70;
        const s = 60 - t * 15;
        const l = 14 + t * 8;
        return new THREE.Color(`hsl(${h},${s}%,${l}%)`);
      }
      function edgeColor(i, total) {
        const t = i / (total - 1);
        const h = 200 + t * 70;
        return new THREE.Color(`hsl(${h},90%,65%)`);
      }

      // ── DOOR HELPER ──
      function createDoor(floorIndex, doorX, doorZ, isXWall) {
        const doorBaseY = floorIndex * FLOOR_HEIGHT + SLAB_H;
        const DW = 1.2, DH = 2.2, FT = 0.12, FD = 0.25;
        const doorCenterY = doorBaseY + DH / 2;
        const frameMat = new THREE.MeshStandardMaterial({ color: 0x1e4d6e, roughness: 0.2, metalness: 0.85 });
        const panelMat = new THREE.MeshStandardMaterial({ color: 0x2a6090, transparent: true, opacity: 0.32, roughness: 0.1, metalness: 0.9 });
        const pieces = isXWall ? [
          { geo: new THREE.BoxGeometry(FD, DH, FT),           mat: frameMat, x: doorX, y: doorCenterY,              z: doorZ - DW/2 - FT/2 },
          { geo: new THREE.BoxGeometry(FD, DH, FT),           mat: frameMat, x: doorX, y: doorCenterY,              z: doorZ + DW/2 + FT/2 },
          { geo: new THREE.BoxGeometry(FD, FT, DW + 2*FT),   mat: frameMat, x: doorX, y: doorBaseY + DH + FT/2,   z: doorZ               },
          { geo: new THREE.BoxGeometry(0.05, DH, DW),         mat: panelMat, x: doorX, y: doorCenterY,              z: doorZ               },
        ] : [
          { geo: new THREE.BoxGeometry(FT, DH, FD),           mat: frameMat, x: doorX - DW/2 - FT/2, y: doorCenterY,            z: doorZ },
          { geo: new THREE.BoxGeometry(FT, DH, FD),           mat: frameMat, x: doorX + DW/2 + FT/2, y: doorCenterY,            z: doorZ },
          { geo: new THREE.BoxGeometry(DW + 2*FT, FT, FD),   mat: frameMat, x: doorX,               y: doorBaseY + DH + FT/2,  z: doorZ },
          { geo: new THREE.BoxGeometry(DW, DH, 0.05),         mat: panelMat, x: doorX,               y: doorCenterY,            z: doorZ },
        ];
        return pieces.map(({ geo, mat, x, y, z }) => {
          const m = new THREE.Mesh(geo, mat);
          m.position.set(x, y, z);
          m.userData = { type: 'door', floorIndex };
          scene.add(m);
          return m;
        });
      }

      // ── STAIRS HELPER ──
      function createStairs(floorIndex) {
        const baseY   = floorIndex * FLOOR_HEIGHT + SLAB_H;
        const NUM_S   = 15;
        const STEP_H  = wallH / NUM_S;
        const STEP_D  = 0.25;
        const STAIR_W = 1.3;
        const SX      = -5.2;
        const SZ0     = -4.35;
        const RAIL_H  = 0.9;
        const stepMat = new THREE.MeshStandardMaterial({ color: 0x1a3a5c, roughness: 0.3, metalness: 0.7 });
        const railMat = new THREE.MeshStandardMaterial({ color: 0x2a6090, roughness: 0.1, metalness: 0.95 });
        const meshes  = [];
        for (let s = 0; s < NUM_S; s++) {
          const step = new THREE.Mesh(
            new THREE.BoxGeometry(STAIR_W, STEP_H, STEP_D),
            stepMat.clone()
          );
          step.position.set(SX, baseY + s * STEP_H + STEP_H / 2, SZ0 + s * STEP_D + STEP_D / 2);
          step.userData = { type: 'stair', floorIndex };
          scene.add(step);
          meshes.push(step);
        }
        // Posts every 3 steps
        const postGeo = new THREE.BoxGeometry(0.05, RAIL_H, 0.05);
        for (let s = 0; s < NUM_S; s += 3) {
          const py = baseY + s * STEP_H + RAIL_H / 2;
          const pz = SZ0 + s * STEP_D;
          [-1, 1].forEach(side => {
            const post = new THREE.Mesh(postGeo.clone(), railMat.clone());
            post.position.set(SX + side * (STAIR_W / 2 - 0.07), py, pz);
            post.userData = { type: 'stair', floorIndex };
            scene.add(post);
            meshes.push(post);
          });
        }
        // Handrail bars (slanted along stair run)
        const totalLen = NUM_S * STEP_D;
        const avgH = baseY + (NUM_S / 2) * STEP_H + RAIL_H;
        [-1, 1].forEach(side => {
          const bar = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, totalLen), railMat.clone());
          bar.position.set(SX + side * (STAIR_W / 2 - 0.07), avgH, SZ0 + totalLen / 2);
          bar.userData = { type: 'stair', floorIndex };
          scene.add(bar);
          meshes.push(bar);
        });
        return meshes;
      }

      for (let i = 0; i < FLOORS; i++) {
        const slabGeo = new THREE.BoxGeometry(12, SLAB_H, 9);
        const slabY   = i * FLOOR_HEIGHT + SLAB_H / 2;
        const slab = new THREE.Mesh(
          slabGeo,
          new THREE.MeshStandardMaterial({
            color:     floorColor(i, FLOORS),
            roughness: 0.35, metalness: 0.55,
          })
        );
        slab.position.y = slabY;
        slab.userData = { type: 'slab', floorIndex: i };
        scene.add(slab);

        const edgeMat   = new THREE.LineBasicMaterial({ color: edgeColor(i, FLOORS) });
        const edgeLines = new Array(4).fill(null).map(() => {
          const lines = new THREE.LineSegments(new THREE.EdgesGeometry(slabGeo), edgeMat);
          lines.position.y = slabY + 0.001;
          scene.add(lines);
          return lines;
        });

        const floorLight = new THREE.PointLight(0x00bcd4, 0.3, 4);
        floorLight.position.set(0, slabY + 1.5, 0);
        scene.add(floorLight);

        const wallMat = new THREE.MeshStandardMaterial({
          color: 0x0e2a40, transparent: true, opacity: 0.55,
          roughness: 0.1, metalness: 0.8,
        });
        const wallY = i * FLOOR_HEIGHT + SLAB_H + wallH / 2;
        const wallDefs = [
          { geo: new THREE.BoxGeometry(12,   wallH, 0.18), x:  0, z: +4.5 },
          { geo: new THREE.BoxGeometry(12,   wallH, 0.18), x:  0, z: -4.5 },
          { geo: new THREE.BoxGeometry(0.18, wallH, 9),    x: -6, z:  0   },
          { geo: new THREE.BoxGeometry(0.18, wallH, 9),    x: +6, z:  0   },
        ];
        const walls = wallDefs.map(({ geo, x, z }, wi) => {
          const wall = new THREE.Mesh(geo, wallMat);
          wall.position.set(x, wallY, z);
          wall.userData = { type: 'wall', floorIndex: i, wallIndex: wi };
          scene.add(wall);
          return wall;
        });
        // ── PARTITION WALLS (rooms) ──
        const partMat = new THREE.MeshStandardMaterial({ color: 0x0a1f30, transparent: true, opacity: 0.38, roughness: 0.2, metalness: 0.6 });
        const partitions = [
          { geo: new THREE.BoxGeometry(0.1, wallH, 9),  x: 0, z: 0 },  // vertical split
          { geo: new THREE.BoxGeometry(12,  wallH, 0.1), x: 0, z: 0 },  // horizontal split
        ].map(({ geo, x, z }) => {
          const p = new THREE.Mesh(geo, partMat.clone());
          p.position.set(x, wallY, z);
          p.userData = { type: 'partition', floorIndex: i };
          scene.add(p);
          return p;
        });

        // ── DOORS ──
        const doors = [
          ...createDoor(i,  2.5,  4.41, false),  // front wall (z=+4.5)
          ...createDoor(i, -5.2, -1.0,  true ),  // left wall  (x=-6)
        ];

        // ── STAIRS ──
        const stairs = createStairs(i);

        window.floors[i] = { index: i, slab, walls, partitions, doors, stairs, edgeLines, ambientLight: floorLight, devices: [] };
      }

      // ── SELECTION STATE ──
      let selectedFloor = null;
      let hoveredSlab = null;
      let xray = false;

      const raycaster = new THREE.Raycaster();
      const mouse     = new THREE.Vector2();

      function getSlabMeshes()  { return window.floors.map(f => f.slab); }
      function getWallMeshes()  { return window.floors.flatMap(f => [...f.walls, ...(f.partitions ?? [])]); }
      function getAllSurfaces() { return [...getSlabMeshes(), ...getWallMeshes()]; }
      function getDeviceHitboxes() { return window.devices.map(d => d.hitbox); }


      // ── INTERIOR / EXTERIOR DETECTION ──
      function detectMountSide(hitPoint, worldNormal) {
        const toPoint = new THREE.Vector3(hitPoint.x, 0, hitPoint.z);
        return worldNormal.dot(toPoint) > 0 ? 'exterior' : 'interior';
      }

      function computeWallRotation(worldNormal) {
        const q = new THREE.Quaternion();
        q.setFromUnitVectors(new THREE.Vector3(0, 0, 1), worldNormal);
        return q;
      }


      // ── GROUP HELPERS ──
      function getAllMeshes(group) {
        return group.children.filter(c => c.isMesh && c.name !== 'hitbox');
      }

      function setGroupEmissive(group, colorHex, intensity = 1) {
        getAllMeshes(group).forEach(m => {
          m.material.emissive.set(colorHex);
          m.material.emissiveIntensity = intensity;
          m.material.needsUpdate = true;
        });
      }

      function setGroupOpacity(group, opacity, transparent) {
        getAllMeshes(group).forEach(m => {
          m.material.opacity = opacity;
          m.material.transparent = transparent;
          m.material.needsUpdate = true;
        });
      }

      function disposeGroup(group) {
        group.traverse(obj => {
          if (!obj.isMesh) return;
          obj.geometry.dispose();
          if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
          else obj.material.dispose();
        });
      }


      // ── FOV WALL-BLOCKED FAN ──
      // Inner faces of the 4 outer walls (XZ segments, same for all floors)
      const FOV_WALL_SEGS = [
        { x1: -5.91, z1: -4.5,  x2: -5.91, z2:  4.5  }, // left inner
        { x1:  5.91, z1: -4.5,  x2:  5.91, z2:  4.5  }, // right inner
        { x1: -5.91, z1:  4.41, x2:  5.91, z2:  4.41 }, // front inner
        { x1: -5.91, z1: -4.41, x2:  5.91, z2: -4.41 }, // back inner
        { x1:  0,    z1: -4.5,  x2:  0,    z2:  4.5  }, // vertical partition
        { x1: -5.91, z1:  0,    x2:  5.91, z2:  0    }, // horizontal partition
      ];

      function raySegIntersect2D(ox, oz, dx, dz, x1, z1, x2, z2) {
        const ex = x2 - x1, ez = z2 - z1;
        const denom = dx * ez - dz * ex;
        if (Math.abs(denom) < 1e-10) return Infinity;
        const t = ((x1 - ox) * ez - (z1 - oz) * ex) / denom;
        const s = ((x1 - ox) * dz - (z1 - oz) * dx) / denom;
        if (t < 0 || s < 0 || s > 1) return Infinity;
        return t;
      }

      function rebuildFOVFan(device) {
        const t = DEVICE_TYPES.find(d => d.id === device.typeId);
        if (!t || !t.hasFOV || !device.fovMesh) return;

        device.group.updateMatrixWorld(true);

        // World-space FOV center direction (local +X of fovCone after all transforms)
        const worldFwd = new THREE.Vector3(1, 0, 0).transformDirection(device.fovCone.matrixWorld);
        const fLen = Math.sqrt(worldFwd.x * worldFwd.x + worldFwd.z * worldFwd.z);
        const fwdX = fLen > 0.001 ? worldFwd.x / fLen : 1;
        const fwdZ = fLen > 0.001 ? worldFwd.z / fLen : 0;

        const halfAngle = THREE.MathUtils.degToRad(t.fovAngle / 2);
        const tilt = device.fovTilt ?? 0;
        const range = t.fovRange * Math.max(0.05, Math.cos(tilt));
        const NUM_RAYS = 72;
        const devX = device.group.position.x;
        const devZ = device.group.position.z;

        // Build fan vertices in local space (relative to device position)
        const verts = [0, 0, 0]; // origin
        for (let i = 0; i <= NUM_RAYS; i++) {
          const a = -halfAngle + (2 * halfAngle * i / NUM_RAYS);
          // Rotate forward direction by angle a around world Y (Three.js Ry convention)
          const c = Math.cos(a), s = Math.sin(a);
          const rayX = c * fwdX + s * fwdZ;
          const rayZ = -s * fwdX + c * fwdZ;

          let dist = range;
          for (const wall of FOV_WALL_SEGS) {
            const d = raySegIntersect2D(devX, devZ, rayX, rayZ,
              wall.x1, wall.z1, wall.x2, wall.z2);
            if (d < dist) dist = d;
          }
          verts.push(rayX * dist, 0, rayZ * dist);
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(verts), 3));
        const idx = [];
        for (let i = 1; i <= NUM_RAYS; i++) idx.push(0, i, i + 1);
        geo.setIndex(idx);

        device.fovMesh.geometry.dispose();
        device.fovMesh.geometry = geo;
        device.fovMesh.position.set(devX, device.group.position.y, devZ);
      }

      function buildFOVCone(device) {
        const t = DEVICE_TYPES.find(d => d.id === device.typeId);
        if (!t || !t.hasFOV) return;

        // Empty wrapper — keeps the transform hierarchy for updateFOVRotation
        const coneWrapper = new THREE.Group();
        device.group.add(coneWrapper);
        device.fovCone = coneWrapper;
        device.fovDirection = device.fovDirection ?? 0;

        // Flat fan mesh added to scene (not device.group) so it renders in world space
        const fanMat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(t.color),
          transparent: true, opacity: 0.18,
          side: THREE.DoubleSide, depthWrite: false,
        });
        const fovMesh = new THREE.Mesh(new THREE.BufferGeometry(), fanMat);
        fovMesh.visible = window.showFOV;
        fovMesh.renderOrder = 1;
        scene.add(fovMesh);
        device.fovMesh = fovMesh;

        updateFOVRotation(device);
      }

      function updateFOVRotation(device) {
        const fd   = device.fovDirection ?? 0;
        const tilt = device.fovTilt      ?? 0;
        const roll = device.fovRoll      ?? 0;

        if (device.mountType === 'floor') {
          // Yaw (world Y) → pitch (local X) → roll (local Z)  →  'YXZ' order
          device.group.rotation.set(tilt, fd, roll, 'YXZ');
          if (device.fovCone) device.fovCone.rotation.set(0, 0, 0);
        } else {
          // Build quaternion: yaw around world Y → align to wall → pitch (local X) → roll (local Z)
          const applyQuat = (baseQ) => {
            const yQuat  = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), fd);
            const mid    = yQuat.clone().multiply(baseQ);
            const localX = new THREE.Vector3(1, 0, 0).applyQuaternion(mid);
            const xQuat  = new THREE.Quaternion().setFromAxisAngle(localX, tilt);
            const afterPitch = xQuat.clone().multiply(mid);
            if (roll !== 0) {
              const localZ = new THREE.Vector3(0, 0, 1).applyQuaternion(afterPitch);
              const zQuat  = new THREE.Quaternion().setFromAxisAngle(localZ, roll);
              device.group.quaternion.multiplyQuaternions(zQuat, afterPitch);
            } else {
              device.group.quaternion.multiplyQuaternions(xQuat, mid);
            }
          };

          if (device.fovCone) {
            if (device.baseQuat) applyQuat(device.baseQuat);
            else device.group.rotation.set(tilt, fd, roll, 'YXZ');
            device.fovCone.rotation.set(0, 0, 0);
          } else {
            if (device.baseQuat) applyQuat(device.baseQuat);
            else device.group.rotation.set(tilt, fd, roll, 'YXZ');
          }
        }
        // Keep device.rotation in sync so serialization captures it
        const r = device.group.rotation;
        device.rotation = { x: +r.x.toFixed(4), y: +r.y.toFixed(4), z: +r.z.toFixed(4) };
        rebuildFOVFan(device);
      }

      // ── FOV OVERLAP CHECK (2D projection on floor plane) ──
      function checkFOVOverlaps() {
        const cams = window.devices.filter(d => {
          const t = DEVICE_TYPES.find(x => x.id === d.typeId);
          return t && t.hasFOV && d.status !== 'offline';
        });

        // Reset all fan colors to default
        cams.forEach(d => {
          const t = DEVICE_TYPES.find(x => x.id === d.typeId);
          if (d.fovMesh) d.fovMesh.material.color.set(t.color);
          d.hasOverlap = false;
        });

        // Pairwise distance check (XZ plane only)
        for (let i = 0; i < cams.length; i++) {
          for (let j = i + 1; j < cams.length; j++) {
            const a = cams[i], b = cams[j];
            const ta = DEVICE_TYPES.find(x => x.id === a.typeId);
            const tb = DEVICE_TYPES.find(x => x.id === b.typeId);
            if (a.floorIndex !== b.floorIndex) continue;

            const dx = a.group.position.x - b.group.position.x;
            const dz = a.group.position.z - b.group.position.z;
            const dist = Math.sqrt(dx * dx + dz * dz);

            if (dist < (ta.fovRange + tb.fovRange) * 0.6) {
              if (a.fovMesh) a.fovMesh.material.color.set(0xff4444);
              if (b.fovMesh) b.fovMesh.material.color.set(0xff4444);
              a.hasOverlap = true;
              b.hasOverlap = true;
            }
          }
        }

        updateSidebar();
      }


      // ── BUILD DEVICE MESH ──
      // createDeviceMesh(typeId) — returns { group, hitbox }
      function createDeviceMesh(typeId) {
        const t = DEVICE_TYPES.find(d => d.id === typeId);
        const g = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color: t.color, roughness: 0.35, metalness: 0.65 });
        const dark = new THREE.MeshStandardMaterial({ color: '#111', roughness: 0.1, metalness: 0.9 });
        const white = new THREE.MeshStandardMaterial({ color: '#d8d8d8', roughness: 0.5, metalness: 0.1 });

        if (typeId === 'cam_fixed') {
          // Bullet camera: tapered body + sun visor + lens + bracket
          const body = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.13, 0.46, 14), mat);
          body.rotation.z = Math.PI / 2;

          const visor = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.03, 0.18), mat);
          visor.position.set(0.04, 0.12, 0);

          const lensHousing = new THREE.Mesh(new THREE.CylinderGeometry(0.095, 0.095, 0.07, 14), mat);
          lensHousing.rotation.z = Math.PI / 2;
          lensHousing.position.x = 0.27;

          const lensGlass = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, 0.025, 16), dark);
          lensGlass.rotation.z = Math.PI / 2;
          lensGlass.position.x = 0.315;

          const arm = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.22, 0.07), mat);
          arm.position.set(0, -0.2, 0);

          const plate = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.07, 0.16), mat);
          plate.position.set(0, -0.33, 0);

          g.add(body, visor, lensHousing, lensGlass, arm, plate);

        } else if (typeId === 'cam_ptz') {
          // PTZ: pan base + tilt arms + camera body
          const base = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.055, 18), mat);
          base.position.y = -0.18;

          const armL = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.16, 0.04), mat);
          armL.position.set(0, -0.04, -0.12);
          const armR = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.16, 0.04), mat);
          armR.position.set(0, -0.04, 0.12);

          const body = new THREE.Mesh(new THREE.CylinderGeometry(0.095, 0.115, 0.38, 14), mat);
          body.rotation.z = Math.PI / 2;
          body.position.y = 0.03;

          const lensHousing = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.085, 0.06, 14), mat);
          lensHousing.rotation.z = Math.PI / 2;
          lensHousing.position.set(0.22, 0.03, 0);

          const lensGlass = new THREE.Mesh(new THREE.CylinderGeometry(0.060, 0.060, 0.022, 16), dark);
          lensGlass.rotation.z = Math.PI / 2;
          lensGlass.position.set(0.258, 0.03, 0);

          g.add(base, armL, armR, body, lensHousing, lensGlass);

        } else if (typeId === 'cam_dome') {
          // Dome camera: flat plate + hemisphere + dark bubble
          const plate = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.28, 0.04, 24), mat);
          plate.position.y = 0.02;

          const dome = new THREE.Mesh(
            new THREE.SphereGeometry(0.20, 18, 9, 0, Math.PI * 2, 0, Math.PI / 2), mat);
          dome.position.y = -0.01;
          dome.rotation.x = Math.PI; // opens downward

          const bubble = new THREE.Mesh(
            new THREE.SphereGeometry(0.145, 14, 7, 0, Math.PI * 2, 0, Math.PI / 2),
            new THREE.MeshStandardMaterial({ color: '#0a1a22', roughness: 0.05, metalness: 0.2, transparent: true, opacity: 0.82 })
          );
          bubble.position.y = -0.01;
          bubble.rotation.x = Math.PI;

          // Four mounting screws at edges
          for (let i = 0; i < 4; i++) {
            const screw = new THREE.Mesh(new THREE.SphereGeometry(0.016, 6, 6), dark);
            const a = (i / 4) * Math.PI * 2;
            screw.position.set(Math.cos(a) * 0.22, 0.04, Math.sin(a) * 0.22);
            g.add(screw);
          }

          g.add(plate, dome, bubble);

        } else if (typeId === 'motion') {
          // PIR sensor: trapezoid wedge + sensor window
          const body = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.115, 0.26, 4), white);
          body.rotation.y = Math.PI / 4;

          const window_ = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.09, 0.015),
            new THREE.MeshStandardMaterial({ color: '#1a0a00', roughness: 0.15, metalness: 0.3 }));
          window_.position.set(0.095, 0.02, 0);

          const led = new THREE.Mesh(new THREE.SphereGeometry(0.015, 8, 8),
            new THREE.MeshStandardMaterial({ color: '#00ff44', emissive: '#00ff44', emissiveIntensity: 0.8 }));
          led.position.set(0.095, 0.09, 0);

          g.add(body, window_, led);

        } else if (typeId === 'smoke') {
          // Smoke detector: tapered disc + dome top + LED
          const base = new THREE.Mesh(new THREE.CylinderGeometry(0.21, 0.235, 0.05, 24), white);

          const top = new THREE.Mesh(
            new THREE.SphereGeometry(0.155, 14, 7, 0, Math.PI * 2, 0, Math.PI / 2), white);
          top.position.y = 0.025;

          const indicator = new THREE.Mesh(new THREE.SphereGeometry(0.016, 8, 8),
            new THREE.MeshStandardMaterial({ color: '#00cc44', emissive: '#00cc44', emissiveIntensity: 0.9 }));
          indicator.position.y = 0.178;

          // Ventilation slots ring
          const ventMat = new THREE.MeshStandardMaterial({ color: '#c8c8c8', roughness: 0.6 });
          for (let i = 0; i < 8; i++) {
            const slot = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.022, 0.006), ventMat);
            const a = (i / 8) * Math.PI * 2;
            slot.position.set(Math.cos(a) * 0.175, 0.02, Math.sin(a) * 0.175);
            slot.rotation.y = a;
            g.add(slot);
          }

          g.add(base, top, indicator);

        } else if (typeId === 'temp') {
          // Temperature sensor: slim body + display screen + foot
          const body = new THREE.Mesh(new THREE.BoxGeometry(0.085, 0.36, 0.055), white);

          const screen = new THREE.Mesh(new THREE.BoxGeometry(0.062, 0.14, 0.008),
            new THREE.MeshStandardMaterial({ color: '#002233', roughness: 0.1, metalness: 0.2,
              emissive: '#001a2b', emissiveIntensity: 0.5 }));
          screen.position.set(0, 0.05, 0.032);

          const foot = new THREE.Mesh(new THREE.BoxGeometry(0.085, 0.035, 0.115), mat);
          foot.position.y = -0.20;

          g.add(body, screen, foot);

        } else if (typeId === 'ac') {
          // Split AC indoor unit: main body + front panel + grille
          const body = new THREE.Mesh(new THREE.BoxGeometry(0.78, 0.20, 0.24), mat);

          const frontPanel = new THREE.Mesh(new THREE.BoxGeometry(0.74, 0.16, 0.015), white);
          frontPanel.position.set(0, 0.005, 0.128);

          // Outlet grille (lower front)
          const grilleMat = new THREE.MeshStandardMaterial({ color: '#b0b0b0', roughness: 0.7 });
          for (let i = 0; i < 5; i++) {
            const vent = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.012, 0.01), grilleMat);
            vent.position.set(0, -0.05 + i * 0.022, 0.128);
            g.add(vent);
          }

          const statusLight = new THREE.Mesh(new THREE.SphereGeometry(0.012, 8, 8),
            new THREE.MeshStandardMaterial({ color: '#00ff88', emissive: '#00ff88', emissiveIntensity: 1.0 }));
          statusLight.position.set(0.34, 0.055, 0.13);

          g.add(body, frontPanel, statusLight);

        } else {
          // Fire alarm: red disc + strobe top + white ring
          const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.185, 0.185, 0.065, 18), mat);

          const strobe = new THREE.Mesh(
            new THREE.SphereGeometry(0.072, 10, 8, 0, Math.PI * 2, 0, Math.PI / 2),
            new THREE.MeshStandardMaterial({ color: '#ffee00', emissive: '#ffbb00', emissiveIntensity: 0.6,
              roughness: 0.1, metalness: 0.1 })
          );
          strobe.position.y = 0.033;

          const ring = new THREE.Mesh(new THREE.TorusGeometry(0.185, 0.013, 8, 24), white);
          ring.rotation.x = Math.PI / 2;
          ring.position.y = 0.033;

          g.add(disc, strobe, ring);
        }

        // Invisible hitbox for raycasting
        const hitbox = new THREE.Mesh(
          new THREE.SphereGeometry(0.30, 6, 6),
          new THREE.MeshBasicMaterial({ visible: false })
        );
        hitbox.name = 'hitbox';
        g.add(hitbox);

        return { group: g, hitbox };
      }


      // ── PLACE DEVICE ──
      function placeDevice(typeId, hitPoint, hitObject, faceNormal) {
        const isSlab = hitObject.userData.type === 'slab';
        const isWall = hitObject.userData.type === 'wall';
        if (!isSlab && !isWall) return null;

        const floorIndex = hitObject.userData.floorIndex;
        const type = DEVICE_TYPES.find(t => t.id === typeId);

        let worldNormal = null;
        let mountType = 'floor';
        let wallQuat = null;

        if (isWall && faceNormal) {
          worldNormal = faceNormal.clone().transformDirection(hitObject.matrixWorld).normalize();
          mountType = detectMountSide(hitPoint, worldNormal);
          wallQuat = computeWallRotation(worldNormal);
        }

        const pos = hitPoint.clone();
        if (isWall && worldNormal) pos.addScaledVector(worldNormal, 0.25);
        else pos.y += 0.35;

        const heightM = +(pos.y.toFixed(2));
        const surfaceNormal = worldNormal
          ? { x: +worldNormal.x.toFixed(4), y: +worldNormal.y.toFixed(4), z: +worldNormal.z.toFixed(4) }
          : null;

        const { group, hitbox } = createDeviceMesh(typeId);
        group.position.copy(pos);
        if (wallQuat) group.setRotationFromQuaternion(wallQuat);
        group.userData = { type: 'device', deviceId: deviceIdCounter };
        hitbox.userData = { type: 'device', deviceId: deviceIdCounter };
        scene.add(group);

        const labelDiv = document.createElement('div');
        labelDiv.textContent = type.label;
        Object.assign(labelDiv.style, {
          background: 'rgba(0,0,0,0.7)', color: '#fff', fontSize: '10px',
          padding: '2px 6px', borderRadius: '10px',
          borderLeft: `2.5px solid ${type.color}`,
        });
        const labelObj = new CSS2DObject(labelDiv);
        labelObj.position.set(0, 0.55, 0);
        group.add(labelObj);

        const euler = group.rotation;
        const device = {
          id: deviceIdCounter++, typeId, floorIndex,
          group, hitbox, labelObj, status: 'online',
          heightM, mountType, surfaceNormal,
          rotation: { x: +euler.x.toFixed(4), y: +euler.y.toFixed(4), z: +euler.z.toFixed(4) },
          fovTilt:  0,
          fovRoll:  0,
          baseQuat: wallQuat ? wallQuat.clone() : null,
        };
        window.devices.push(device);
        window.floors[floorIndex].devices.push(device.id);
        buildFOVCone(device);

        checkFOVOverlaps(); updateHUD(); updateSidebar(); autoSave();
        return device;
      }


      // ── PREVIEW GHOST ──
      let previewMesh = null;

      function showPreview(typeId) {
        hidePreview();
        const { group } = createDeviceMesh(typeId);
        group.traverse(obj => {
          if (obj.isMesh && obj.name !== 'hitbox') {
            obj.material.transparent = true;
            obj.material.opacity = 0.45;
            obj.material.depthWrite = false;
          }
        });
        group.userData = { type: 'preview' };

        const ringGeo = new THREE.RingGeometry(0.38, 0.55, 24);
        const ringMat = new THREE.MeshBasicMaterial({
          color: parseInt(DEVICE_TYPES.find(t => t.id === typeId).color.replace('#',''), 16),
          side: THREE.DoubleSide, transparent: true, opacity: 0.55,
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = -Math.PI / 2;
        ring.position.y = -0.30;
        ring.name = 'ring';
        group.add(ring);

        group.visible = false;
        scene.add(group);
        previewMesh = group;
      }

      function hidePreview() {
        if (previewMesh) {
          scene.remove(previewMesh);
          disposeGroup(previewMesh);
          previewMesh = null;
        }
      }

      function movePreview(hitPoint, hitObject, faceNormal) {
        if (!previewMesh) return;
        const isSlab = hitObject.userData.type === 'slab';
        const isWall = hitObject.userData.type === 'wall';
        const ring = previewMesh.getObjectByName('ring');

        if (isWall && faceNormal) {
          const worldNormal = faceNormal.clone().transformDirection(hitObject.matrixWorld).normalize();
          previewMesh.position.copy(hitPoint).addScaledVector(worldNormal, 0.25);
          previewMesh.setRotationFromQuaternion(computeWallRotation(worldNormal));
          if (ring) ring.visible = false;
        } else if (isSlab) {
          previewMesh.position.copy(hitPoint);
          previewMesh.position.y += 0.35;
          previewMesh.rotation.set(0, 0, 0);
          if (ring) ring.visible = true;
        }
        previewMesh.visible = true;
      }


      // ── WALL HIGHLIGHT ──
      let wallHighlight = null;

      function updateWallHighlight(hitPoint, worldNormal, mountType) {
        clearWallHighlight();
        const color = mountType === 'exterior' ? 0x378ADD : 0x7B5EA7;
        const geo = new THREE.PlaneGeometry(0.9, 0.9);
        const mat = new THREE.MeshBasicMaterial({
          color, transparent: true, opacity: 0.28, side: THREE.DoubleSide, depthWrite: false,
        });
        wallHighlight = new THREE.Mesh(geo, mat);
        wallHighlight.position.copy(hitPoint).addScaledVector(worldNormal, 0.02);
        wallHighlight.lookAt(wallHighlight.position.clone().add(worldNormal));
        scene.add(wallHighlight);
      }

      function clearWallHighlight() {
        if (wallHighlight) {
          scene.remove(wallHighlight);
          wallHighlight.geometry.dispose();
          wallHighlight.material.dispose();
          wallHighlight = null;
        }
      }


      // ── AIM STATE ──
      let aimingDevice      = null;
      let heightAdjDevice   = null;
      let aimPrevMouse      = null;  // {x, y} — delta tracking for quaternion rotation
      let aimGizmo          = null;  // THREE.Group — axis arrows, child of device.group
      let aimMouseDown      = false; // true only while left button is held in aim mode
      let aimDragMoved      = false; // true once rotation has been applied in current drag
      let hoveredDevice     = null;  // device currently under cursor (for R shortcut)
      window.showFOV = true;

      function showAimGizmo(device) {
        hideAimGizmo();
        const g = new THREE.Group();
        g.name = 'aim_gizmo';
        // 3 trục: X đỏ (forward/lens), Y xanh lá (up), Z xanh dương (right)
        [
          [1,0,0, 0.5, 0xff3333],
          [0,1,0, 0.5, 0x22dd44],
          [0,0,1, 0.5, 0x3399ff],
        ].forEach(([x,y,z,len,color]) => {
          g.add(new THREE.ArrowHelper(
            new THREE.Vector3(x,y,z), new THREE.Vector3(0,0,0),
            len, color, len * 0.25, len * 0.14
          ));
        });
        // Aim line dài theo trục X (hướng lens) — thấy rõ thiết bị chỉ về đâu
        g.add(new THREE.ArrowHelper(
          new THREE.Vector3(1,0,0), new THREE.Vector3(0,0,0),
          1.4, 0xff8888, 0.2, 0.1
        ));
        device.group.add(g);
        aimGizmo = g;
      }

      function hideAimGizmo() {
        if (!aimGizmo) return;
        aimGizmo.parent?.remove(aimGizmo);
        aimGizmo.traverse(o => {
          if (o.isMesh || o.isLine) {
            o.geometry?.dispose();
            if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
            else o.material?.dispose();
          }
        });
        aimGizmo = null;
      }

      // ── DRAG STATE ──
      let dragState = null;
      const DRAG_THRESHOLD = 6;
      let suppressNextClick = false;

      const dragCursor = document.getElementById('drag-cursor');
      const dropHint   = document.getElementById('drop-hint');

      function cancelDrag() {
        if (!dragState) return;
        // Restore device visibility if move drag
        if (dragState.mode === 'move' && dragState.device) {
          dragState.device.group.visible = true;
        }
        dragState = null;
        controls.enabled = true;
        hidePreview();
        clearWallHighlight();
        if (dragCursor) dragCursor.style.display = 'none';
        if (dropHint) dropHint.classList.remove('active');
        document.querySelectorAll('.catalog-card.dragging').forEach(c => c.classList.remove('dragging'));
        document.removeEventListener('mousemove', onDragMouseMove);
        document.removeEventListener('mouseup',   onDragMouseUp);
        renderer.domElement.style.cursor = 'default';
        tooltip.style.display = 'none';
      }

      // Start drag from catalog card
      function onCatalogMouseDown(e) {
        if (e.button !== 0) return;
        e.preventDefault();
        const typeId = e.currentTarget.dataset.typeId;
        dragState = { mode: 'new', typeId, startX: e.clientX, startY: e.clientY, active: false };
        document.addEventListener('mousemove', onDragMouseMove);
        document.addEventListener('mouseup',   onDragMouseUp);
      }

      // Start drag to reposition an existing device
      renderer.domElement.addEventListener('mousedown', (e) => {
        if (aimingDevice !== null) return;
        if (e.button !== 0 || dragState) return;
        mouse.x =  (e.clientX / canvasW()) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        const hitboxes = getDeviceHitboxes();
        const hits = hitboxes.length ? raycaster.intersectObjects(hitboxes, false) : [];
        if (!hits.length) return;

        const devId = hits[0].object.userData.deviceId;
        const device = window.devices.find(d => d.id === devId);
        if (!device) return;

        controls.enabled = false;
        suppressNextClick = true;
        dragState = {
          mode: 'move', deviceId: devId, device,
          typeId: device.typeId,
          startX: e.clientX, startY: e.clientY, active: false,
        };
        document.addEventListener('mousemove', onDragMouseMove);
        document.addEventListener('mouseup',   onDragMouseUp);
      });

      // Aim mode: track mouse button held state
      renderer.domElement.addEventListener('mousedown', (e) => {
        if (aimingDevice === null) return;
        if (e.button !== 0) return;
        aimMouseDown = true;
        aimDragMoved = false;
        aimPrevMouse = { x: e.clientX, y: e.clientY };
      });

      renderer.domElement.addEventListener('mouseup', (e) => {
        if (!aimMouseDown) return;
        aimMouseDown = false;
        if (aimDragMoved) {
          suppressNextClick = true;
        }
        aimDragMoved = false;
      });

      function onDragMouseMove(e) {
        if (!dragState) return;
        const dx = e.clientX - dragState.startX;
        const dy = e.clientY - dragState.startY;

        if (!dragState.active) {
          if (Math.sqrt(dx * dx + dy * dy) < DRAG_THRESHOLD) return;
          dragState.active = true;
          controls.enabled = false;

          // Hide original device when moving
          if (dragState.mode === 'move' && dragState.device) {
            dragState.device.group.visible = false;
          }

          showPreview(dragState.typeId);
          if (dropHint) dropHint.classList.add('active');

          const type = DEVICE_TYPES.find(t => t.id === dragState.typeId);
          if (dragCursor) {
            dragCursor.textContent = type.icon;
            dragCursor.style.display = 'block';
          }
          if (dragState.mode === 'new') {
            document.querySelectorAll('.catalog-card').forEach(c => {
              if (c.dataset.typeId === dragState.typeId) c.classList.add('dragging');
            });
          }
        }

        if (dragCursor) {
          dragCursor.style.left = e.clientX + 'px';
          dragCursor.style.top  = e.clientY + 'px';
        }

        if (e.clientX >= canvasW()) {
          if (previewMesh) previewMesh.visible = false;
          clearWallHighlight();
          tooltip.style.display = 'none';
          renderer.domElement.style.cursor = 'no-drop';
          return;
        }

        if (!previewMesh) showPreview(dragState.typeId);

        mouse.x =  (e.clientX / canvasW()) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        const hits = raycaster.intersectObjects(getAllSurfaces(), false);

        if (hits.length > 0) {
          const hit    = hits[0];
          const hitObj = hit.object;
          const isSlab = hitObj.userData.type === 'slab';
          const isWall = hitObj.userData.type === 'wall';

          movePreview(hit.point, hitObj, hit.face.normal);
          renderer.domElement.style.cursor = 'copy';

          // Wall highlight + tooltip
          if (isWall) {
            const wn = hit.face.normal.clone().transformDirection(hitObj.matrixWorld).normalize();
            const mountType = detectMountSide(hit.point, wn);
            updateWallHighlight(hit.point, wn, mountType);

            const previewY  = (hit.point.y + 0.25).toFixed(1);
            const floorLabel = 'Tầng ' + (hitObj.userData.floorIndex + 1);
            if (mountType === 'exterior') {
              tooltip.innerHTML = `
                <div style="background:#1a3a5c;border-left:3px solid #378ADD;padding:6px 10px;border-radius:6px;min-width:140px">
                  <div style="color:#378ADD;font-weight:600;font-size:12px">↗ Gắn NGOÀI tường</div>
                  <div style="color:#94a3b8;font-size:11px;margin-top:2px">${floorLabel} · ${previewY}m</div>
                </div>`;
            } else {
              tooltip.innerHTML = `
                <div style="background:#2a1a4e;border-left:3px solid #7B5EA7;padding:6px 10px;border-radius:6px;min-width:140px">
                  <div style="color:#9B7FD4;font-weight:600;font-size:12px">↙ Gắn TRONG tường</div>
                  <div style="color:#94a3b8;font-size:11px;margin-top:2px">${floorLabel} · ${previewY}m</div>
                </div>`;
            }
          } else {
            clearWallHighlight();
            const previewY  = (hit.point.y + 0.35).toFixed(1);
            const floorLabel = 'Tầng ' + (hitObj.userData.floorIndex + 1);
            tooltip.innerHTML = `
              <div style="background:#1a2a1a;border-left:3px solid #1D9E75;padding:6px 10px;border-radius:6px;min-width:120px">
                <div style="color:#1D9E75;font-weight:600;font-size:12px">▥ Đặt lên sàn</div>
                <div style="color:#94a3b8;font-size:11px;margin-top:2px">${floorLabel} · ${previewY}m</div>
              </div>`;
          }
          tooltip.style.left    = (e.clientX + 16) + 'px';
          tooltip.style.top     = (e.clientY + 10) + 'px';
          tooltip.style.display = 'block';
        } else {
          if (previewMesh) previewMesh.visible = false;
          clearWallHighlight();
          tooltip.style.display = 'none';
          renderer.domElement.style.cursor = 'no-drop';
        }
      }

      function onDragMouseUp(e) {
        document.removeEventListener('mousemove', onDragMouseMove);
        document.removeEventListener('mouseup',   onDragMouseUp);

        if (!dragState) return;
        const { mode, active, typeId, device: movingDevice } = dragState;
        dragState = null;

        controls.enabled = true;
        document.querySelectorAll('.catalog-card.dragging').forEach(c => c.classList.remove('dragging'));
        if (dragCursor) dragCursor.style.display = 'none';
        if (dropHint) dropHint.classList.remove('active');
        tooltip.style.display = 'none';
        clearWallHighlight();
        renderer.domElement.style.cursor = 'default';

        // Restore visibility if move drag (even on cancel)
        if (mode === 'move' && movingDevice) {
          movingDevice.group.visible = true;
        }

        if (!active) {
          if (mode === 'move' && movingDevice) {
            const t = DEVICE_TYPES.find(tt => tt.id === movingDevice.typeId);
            if (t?.hasFOV) {
              aimingDevice = movingDevice;
              movingDevice.aimQuat = movingDevice.group.quaternion.clone();
              aimPrevMouse = null;
              aimMouseDown = false;
              aimDragMoved = false;
              showAimGizmo(movingDevice);
              controls.enabled = false;
              document.getElementById('aim-hint').style.display = 'block';
            }
          }
          return;
        }

        if (e.clientX >= canvasW()) {
          hidePreview();
          return;
        }

        mouse.x =  (e.clientX / canvasW()) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        const hits = raycaster.intersectObjects(getAllSurfaces(), false);
        hidePreview();

        if (!hits.length) return;

        const hit = hits[0];

        if (mode === 'new') {
          const newDevice = placeDevice(typeId, hit.point, hit.object, hit.face.normal);
          if (newDevice) {
            const type = DEVICE_TYPES.find(t => t.id === typeId);
            const mountLabel = newDevice.mountType === 'exterior' ? 'ngoài' : newDevice.mountType === 'interior' ? 'trong' : 'sàn';
            showToast(`${type.icon} ${type.label} đặt tại ${newDevice.heightM}m (${mountLabel})`, 'success');
          }

        } else if (mode === 'move' && movingDevice) {
          // Compute new position + orientation
          const isWall = hit.object.userData.type === 'wall';
          const isSlab = hit.object.userData.type === 'slab';
          const newFloorIndex = hit.object.userData.floorIndex;

          let worldNormal = null;
          let mountType = 'floor';
          let wallQuat = null;

          if (isWall && hit.face.normal) {
            worldNormal = hit.face.normal.clone().transformDirection(hit.object.matrixWorld).normalize();
            mountType = detectMountSide(hit.point, worldNormal);
            wallQuat = computeWallRotation(worldNormal);
          }

          const newPos = hit.point.clone();
          if (isWall && worldNormal) newPos.addScaledVector(worldNormal, 0.25);
          else newPos.y += 0.35;

          const newHeightM = +(newPos.y.toFixed(2));
          const newSurfaceNormal = worldNormal
            ? { x: +worldNormal.x.toFixed(4), y: +worldNormal.y.toFixed(4), z: +worldNormal.z.toFixed(4) }
            : null;

          // Giữ rotation offset tương đối với base cũ, áp lên base mới
          const oldBase = movingDevice.baseQuat
            ? movingDevice.baseQuat.clone()
            : new THREE.Quaternion();
          const relativeQ = new THREE.Quaternion()
            .multiplyQuaternions(oldBase.clone().invert(), movingDevice.group.quaternion);
          const newBase = wallQuat ? wallQuat.clone() : new THREE.Quaternion();
          const preservedQuat = new THREE.Quaternion()
            .multiplyQuaternions(newBase, relativeQ);

          // Update group position/rotation
          movingDevice.group.position.copy(newPos);
          movingDevice.group.setRotationFromQuaternion(preservedQuat);
          movingDevice.baseQuat = wallQuat ? wallQuat.clone() : null;

          // Update floor arrays
          const oldFloor = window.floors[movingDevice.floorIndex];
          oldFloor.devices = oldFloor.devices.filter(id => id !== movingDevice.id);
          movingDevice.floorIndex = newFloorIndex;
          movingDevice.heightM = newHeightM;
          movingDevice.mountType = mountType;
          movingDevice.surfaceNormal = newSurfaceNormal;
          const euler = movingDevice.group.rotation;
          movingDevice.rotation = { x: +euler.x.toFixed(4), y: +euler.y.toFixed(4), z: +euler.z.toFixed(4) };
          window.floors[newFloorIndex].devices.push(movingDevice.id);

          rebuildFOVFan(movingDevice);
          const type = DEVICE_TYPES.find(t => t.id === movingDevice.typeId);
          const mountLabel = mountType === 'exterior' ? 'ngoài' : mountType === 'interior' ? 'trong' : 'sàn';
          showToast(`${type.icon} đã di chuyển → ${newHeightM}m (${mountLabel})`, 'success');
          updateSidebar(); updateHUD(); autoSave();
        }
      }


      // ── HUD ──
      const hud = document.createElement('div');
      hud.id = 'hud';
      Object.assign(hud.style, {
        position: 'fixed', top: '1rem', left: '1rem',

      });

      function updateHUD() {
        const total = window.devices.length;
        let maxCount = 0, maxFloor = -1;
        window.floors.forEach((f, i) => {

          let allDone = true;
          window.floors.forEach(f => {
            f.walls.forEach(w => {

              if (Math.abs(delta) < 0.005) { w.material.opacity = target; }
              else { w.material.opacity += delta * 0.08; allDone = false; }

      // ── SIDEBAR ──
      const sidebar = document.createElement('div');

        <div id="device-catalog" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px"></div>
        <div style="font-size:10px;color:#3a3a60;line-height:1.55;margin-bottom:12px;padding:8px;background:rgba(55,138,221,0.06);border-radius:6px;border:1px solid rgba(55,138,221,0.12)">
          <div>📌 Kéo thả vào canvas để đặt</div>
          <div style="margin-top:4px">🏠 <span style="color:#555f7a">Ngoài tường:</span> kéo trực tiếp</div>

      document.body.appendChild(sidebar);

      // Catalog cards
      const catalogEl = document.getElementById('device-catalog');
      function refreshCatalogHighlight() {
        document.querySelectorAll('.catalog-card').forEach(c => {
          const t = DEVICE_TYPES.find(tt => tt.id === c.dataset.typeId);
          const isActive = c.dataset.typeId === activeTypeId;
          c.style.borderColor = isActive ? t.color : 'rgba(255,255,255,0.08)';
          c.style.background  = isActive ? hexToRgba(t.color, 0.15) : 'rgba(255,255,255,0.04)';
        });
      }

      DEVICE_TYPES.forEach(type => {
        const card = document.createElement('div');
        card.className = 'catalog-card';
        card.dataset.typeId = type.id;
        card.innerHTML = `
          <span style="width:8px;height:8px;border-radius:50%;background:${type.color};flex-shrink:0"></span>
          <span>${type.icon} ${type.label}</span>
        `;
        card.addEventListener('mousedown', onCatalogMouseDown);
        card.addEventListener('click', () => {
          activeTypeId = type.id;
          refreshCatalogHighlight();
        });
        catalogEl.appendChild(card);
      });
      refreshCatalogHighlight();

      function hexToRgba(hex, alpha) {
        const r = parseInt(hex.slice(1,3),16);
        const g = parseInt(hex.slice(3,5),16);
        const b = parseInt(hex.slice(5,7),16);
        return `rgba(${r},${g},${b},${alpha})`;
      }


      // ── FLOOR SELECTION FROM SIDEBAR ──
      function selectFloorInScene(i) {
        if (selectedFloor !== null) {
          const prev = window.floors[selectedFloor].slab;
          prev.material.emissive.set(0x000000);
          prev.material.emissiveIntensity = 0;
        }
        selectedFloor = i;
        const curr = window.floors[i].slab;
        curr.material.emissive.set('#ffffff');
        curr.material.emissiveIntensity = 0.08;
        hoveredSlab = null;
        updateHUD();
      }

      // ── DELETE DEVICE ──
      function deleteDevice(id) {
        if (aimingDevice && aimingDevice.id === id) {
          aimGizmo = null;
          aimingDevice = null;
          aimPrevMouse = null;
          aimMouseDown = false;
          aimDragMoved = false;
          controls.enabled = true;
          document.getElementById('aim-hint').style.display = 'none';
        }
        const idx = window.devices.findIndex(d => d.id === id);
        if (idx === -1) return;
        const dev = window.devices[idx];
        dev.group.remove(dev.labelObj);
        scene.remove(dev.group);
        disposeGroup(dev.group);
        if (dev.fovMesh) {
          scene.remove(dev.fovMesh);
          dev.fovMesh.geometry.dispose();
          dev.fovMesh.material.dispose();
        }
        window.devices.splice(idx, 1);
        const floor = window.floors[dev.floorIndex];
        floor.devices = floor.devices.filter(fid => fid !== id);
        checkFOVOverlaps(); updateSidebar(); updateHUD(); autoSave();
      }

      // ── SET STATUS ──
      function setStatus(id, status) {
        const device = window.devices.find(d => d.id === id);
        if (!device) return;
        device.status = status;
        if (status === 'online') {
          setGroupEmissive(device.group, '#1D9E75', 0.4);
          setGroupOpacity(device.group, 1.0, false);
        } else if (status === 'warning') {
          setGroupEmissive(device.group, '#EF9F27', 0.6);
          setGroupOpacity(device.group, 1.0, false);
        } else {
          setGroupEmissive(device.group, '#000000', 0);
          setGroupOpacity(device.group, 0.35, true);
        }
        checkFOVOverlaps(); updateSidebar(); autoSave();
      }

      // ── PULSE DEVICE ──
      function pulseDevice(id) {
        const dev = window.devices.find(d => d.id === id);
        if (!dev) return;
        const duration = 350;
        const start = performance.now();
        function tick(now) {
          const t = Math.min((now - start) / duration, 1);
          const s = t < 0.5 ? 1 + 0.8 * (t * 2) : 1 + 0.8 * (2 - t * 2);
          dev.group.scale.setScalar(s);
          if (t < 1) requestAnimationFrame(tick);
          else dev.group.scale.setScalar(1);
        }
        requestAnimationFrame(tick);
      }

      // ── SIDEBAR UPDATE ──
      function updateSidebar() {
        const list        = document.getElementById('device-list');
        const emptyState  = document.getElementById('empty-state');
        const totalBadge  = document.getElementById('total-badge');
        const statOnline  = document.getElementById('stat-online');
        const statWarning = document.getElementById('stat-warning');
        const statOffline = document.getElementById('stat-offline');
        if (!list) return;

        let online = 0, warning = 0, offline = 0;
        window.devices.forEach(d => {
          if (d.status === 'online') online++;
          else if (d.status === 'warning') warning++;
          else offline++;
        });
        totalBadge.textContent = window.devices.length;
        statOnline.textContent  = online;
        statWarning.textContent = warning;
        statOffline.textContent = offline;

        list.innerHTML = '';
        emptyState.style.display = window.devices.length === 0 ? 'block' : 'none';
        if (!window.devices.length) return;

        const byFloor = {};
        window.devices.forEach(d => {
          if (!byFloor[d.floorIndex]) byFloor[d.floorIndex] = [];
          byFloor[d.floorIndex].push(d);
        });

        Object.keys(byFloor).sort((a, b) => a - b).forEach(fi => {
          const hdr = document.createElement('div');
          hdr.style.cssText = 'font-size:11px;opacity:.5;margin-top:12px;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px';
