          byFloor[fi].forEach(dev => {
            const type = DEVICE_TYPES.find(t => t.id === dev.typeId);
            const statusColor = dev.status === 'online' ? '#1D9E75' : dev.status === 'warning' ? '#E2A84B' : '#E24B4A';
            const mountIcon  = dev.mountType === 'exterior' ? '↗' : dev.mountType === 'interior' ? '↙' : '▥';
            const mountTitle = dev.mountType === 'exterior' ? 'Ngoài' : dev.mountType === 'interior' ? 'Trong' : 'Sàn';
            const heightLabel = dev.heightM != null ? `${dev.heightM}m` : '';

            const row = document.createElement('div');
            row.className = 'device-row';
            row.style.cssText = 'display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;cursor:pointer;transition:background 0.15s';
            row.innerHTML = `
              <span style="width:8px;height:8px;border-radius:50%;background:${type.color};flex-shrink:0"></span>
              <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                ${type.icon} ${type.label} <span style="color:#555;font-size:11px">#${dev.id}</span>
              </span>
              ${heightLabel ? `<span style="font-size:10px;color:#64748b;flex-shrink:0">${heightLabel}</span>` : ''}
              <span style="font-size:10px;color:#4a5568;flex-shrink:0" title="${mountTitle}">${mountIcon}</span>
              <span style="width:9px;height:9px;border-radius:50%;background:${statusColor};flex-shrink:0"></span>
              ${dev.hasOverlap ? `<span style="background:#ff4444;border-radius:99px;padding:1px 5px;font-size:9px;flex-shrink:0;color:#fff;line-height:1.4">⚠</span>` : ''}
              <button class="del-btn" style="background:none;border:none;color:#fff;font-size:14px;cursor:pointer;opacity:.4;padding:0 2px;line-height:1">🗑</button>
            `;
            row.querySelector('.del-btn').addEventListener('click', ev => { ev.stopPropagation(); deleteDevice(dev.id); });
            row.addEventListener('click', () => { selectFloorInScene(dev.floorIndex); pulseDevice(dev.id); });
            list.appendChild(row);
          });
        });
      }


      // ── MOUSE EVENTS ──
      const tooltip = document.getElementById('tooltip');
      const ctxMenu = document.getElementById('ctx-menu');

      function updateAimHint(device) {
        const fw   = new THREE.Vector3(1, 0, 0).applyQuaternion(device.aimQuat);
        const tilt = Math.round(THREE.MathUtils.radToDeg(Math.asin(Math.max(-1, Math.min(1, fw.y)))));
        const pan  = Math.round(THREE.MathUtils.radToDeg(device.group.rotation.y));
        document.getElementById('aim-hint').textContent =
          `Kéo: xoay | ↑↓: nghiêng | ←→: quay | Q·E/Cuộn: lăn | Pan:${pan}° Tilt:${tilt}° | Shift+phím: chính xác | Click/Esc: xong`;
      }

      renderer.domElement.addEventListener('mousemove', (e) => {
        if (dragState && dragState.active) return;

        if (aimingDevice !== null) {
          if (aimMouseDown && aimPrevMouse !== null) {
            const dx = e.clientX - aimPrevMouse.x;
            const dy = e.clientY - aimPrevMouse.y;
            const sens = 0.008;

            const yawQ = new THREE.Quaternion()
              .setFromAxisAngle(new THREE.Vector3(0, 1, 0), dx * sens);

            // Device-local Z = trục nghiêng tự nhiên, không đổi theo góc nhìn camera
            const pitchQ = new THREE.Quaternion()
              .setFromAxisAngle(new THREE.Vector3(0, 0, 1), dy * sens);

            // Yaw: world-space (premultiply), Pitch: device-local (multiply)
            aimingDevice.aimQuat.premultiply(yawQ).multiply(pitchQ);
            aimingDevice.group.quaternion.copy(aimingDevice.aimQuat);
            aimingDevice.group.updateMatrixWorld(true);

            const r = aimingDevice.group.rotation;
            aimingDevice.rotation = { x: +r.x.toFixed(4), y: +r.y.toFixed(4), z: +r.z.toFixed(4) };
            rebuildFOVFan(aimingDevice);
            aimDragMoved = true;
            updateAimHint(aimingDevice);
          }
          if (aimMouseDown) {
            aimPrevMouse = { x: e.clientX, y: e.clientY };
          }
          renderer.domElement.style.cursor = aimMouseDown ? 'move' : 'crosshair';
          return;
        }

        mouse.x =  (e.clientX / canvasW())  * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        const hitboxes = getDeviceHitboxes();
        const devHits  = hitboxes.length ? raycaster.intersectObjects(hitboxes, false) : [];

        let hitDevice = false;
        let hitSlab   = false;

        if (devHits.length > 0) {
          hitDevice = true;
          const devId  = devHits[0].object.userData.deviceId;
          const device = window.devices.find(d => d.id === devId);
          hoveredDevice = device;
          const type   = DEVICE_TYPES.find(t => t.id === device.typeId);
          const pillColor   = device.status === 'online' ? '#1D9E75' : device.status === 'warning' ? '#EF9F27' : '#666';
          const mountLabel  = device.mountType === 'exterior' ? 'Ngoài tường' : device.mountType === 'interior' ? 'Trong tường' : 'Trên sàn';
          tooltip.innerHTML = `
            <div>${type.icon} ${type.label} <span style="color:#888">#${device.id}</span></div>
            <div style="color:#aaa">Tầng ${device.floorIndex + 1}${device.heightM != null ? ' · ' + device.heightM + 'm' : ''}</div>
            <div style="color:#64748b;font-size:11px">${mountLabel}</div>
            <div style="margin-top:2px"><span style="background:${pillColor};border-radius:99px;padding:1px 8px;font-size:11px">${device.status}</span></div>
            <div style="color:#3a3a55;font-size:10px;margin-top:4px">Kéo để di chuyển</div>
          `;
          tooltip.style.left = (e.clientX + 14) + 'px';
          tooltip.style.top  = (e.clientY + 10) + 'px';
          tooltip.style.display = 'block';
          if (hoveredSlab) {
            if (hoveredSlab.userData.floorIndex !== selectedFloor) {
              hoveredSlab.material.emissive.set(0x000000);
              hoveredSlab.material.emissiveIntensity = 0;
            }
            hoveredSlab = null;
          }
        } else {
          tooltip.style.display = 'none';
          hoveredDevice = null;
          const hits = raycaster.intersectObjects(getSlabMeshes());
          if (hoveredSlab) {
            if (hoveredSlab.userData.floorIndex !== selectedFloor) {
              hoveredSlab.material.emissive.set(0x000000);
              hoveredSlab.material.emissiveIntensity = 0;
            }
            hoveredSlab = null;
          }
          if (hits.length > 0) {
            hitSlab = true;
            const m = hits[0].object;
            if (m.userData.floorIndex !== selectedFloor) {
              m.material.emissive.set(0x334455);
              m.material.emissiveIntensity = 0.3;
            }
            hoveredSlab = m;
          }
        }

        renderer.domElement.style.cursor = hitDevice ? 'grab' : hitSlab ? 'crosshair' : 'default';
      });

      renderer.domElement.addEventListener('mouseleave', () => { aimPrevMouse = null; });

      // Scroll wheel: height adjustment mode → move up/down; aiming mode → roll
      renderer.domElement.addEventListener('wheel', (e) => {
        if (heightAdjDevice !== null) {
          const step = e.deltaY < 0 ? 0.05 : -0.05;
          heightAdjDevice.group.position.y = Math.max(0.1,
            +(heightAdjDevice.group.position.y + step).toFixed(2));
          heightAdjDevice.heightM = heightAdjDevice.group.position.y;
          rebuildFOVFan(heightAdjDevice);
          updateSidebar(); updateHUD(); autoSave();
          return;
        }
        if (aimingDevice === null) return;
        // Roll quanh trục +X cục bộ của thiết bị (không clamp — 360° tự do)
        if (!aimingDevice.aimQuat) aimingDevice.aimQuat = aimingDevice.group.quaternion.clone();
        const rollQ = new THREE.Quaternion()
          .setFromAxisAngle(new THREE.Vector3(1, 0, 0), -e.deltaY * 0.002);
        aimingDevice.aimQuat.multiply(rollQ);
        aimingDevice.group.quaternion.copy(aimingDevice.aimQuat);
        aimingDevice.group.updateMatrixWorld(true);
        const rv = aimingDevice.group.rotation;
        aimingDevice.rotation = { x: +rv.x.toFixed(4), y: +rv.y.toFixed(4), z: +rv.z.toFixed(4) };
        rebuildFOVFan(aimingDevice);
        updateAimHint(aimingDevice);
      }, { passive: true });

      // Height / Aim mode exit click
      renderer.domElement.addEventListener('click', (e) => {
        if (heightAdjDevice !== null) {
          heightAdjDevice = null;
          controls.enabled = true;
          document.getElementById('height-hint').style.display = 'none';
          renderer.domElement.style.cursor = 'default';
          return;
        }
        if (aimingDevice === null) return;
        hideAimGizmo();
        aimingDevice = null;
        controls.enabled = true;
        document.getElementById('aim-hint').style.display = 'none';
        renderer.domElement.style.cursor = 'default';
        checkFOVOverlaps(); autoSave();
      });

      // Regular click — floor selection (guard suppressNextClick)
      renderer.domElement.addEventListener('click', (e) => {
        if (suppressNextClick) { suppressNextClick = false; return; }
        if (e.shiftKey) return;
        mouse.x =  (e.clientX / canvasW())  * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObjects(getSlabMeshes());

        if (selectedFloor !== null) {
          const prev = window.floors[selectedFloor].slab;
          prev.material.emissive.set(0x000000);
          prev.material.emissiveIntensity = 0;
        }

        if (hits.length > 0) {
          selectedFloor = hits[0].object.userData.floorIndex;
          hits[0].object.material.emissive.set('#ffffff');
          hits[0].object.material.emissiveIntensity = 0.08;
        } else {
          selectedFloor = null;
        }
        hoveredSlab = null;
        updateHUD();
      });

      // Shift+click fallback placement on floor or wall
      renderer.domElement.addEventListener('click', (e) => {
        if (!e.shiftKey) return;
        mouse.x =  (e.clientX / canvasW())  * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObjects(getAllSurfaces(), false);
        if (!hits.length) return;
        const hit = hits[0];
        const device = placeDevice(activeTypeId, hit.point, hit.object, hit.face.normal);
        if (device) {
          const type = DEVICE_TYPES.find(t => t.id === activeTypeId);
          showToast(`${type.icon} ${type.label} đặt tại ${device.heightM}m`, 'success');
        }
      });

      // Context menu
      renderer.domElement.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        mouse.x =  (e.clientX / canvasW())  * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const hitboxes = getDeviceHitboxes();
        const hits = hitboxes.length ? raycaster.intersectObjects(hitboxes, false) : [];
        if (hits.length > 0) {
          const devId = hits[0].object.userData.deviceId;
          ctxMenu.innerHTML = `
            <div class="ctx-item" data-action="rotate"   data-id="${devId}" style="border-bottom:0.5px solid rgba(255,255,255,0.08);padding-bottom:6px;margin-bottom:4px">↻ Xoay thiết bị</div>
            <div class="ctx-item" data-action="resetrot" data-id="${devId}" style="border-bottom:0.5px solid rgba(255,255,255,0.08);padding-bottom:6px;margin-bottom:4px">↺ Reset xoay</div>
            <div class="ctx-item" data-action="height"   data-id="${devId}" style="border-bottom:0.5px solid rgba(255,255,255,0.08);padding-bottom:6px;margin-bottom:4px">↕ Điều chỉnh độ cao</div>
            <div class="ctx-item" data-action="online"   data-id="${devId}">Set Online</div>
            <div class="ctx-item" data-action="warning"  data-id="${devId}">Set Warning</div>
            <div class="ctx-item" data-action="offline"  data-id="${devId}">Set Offline</div>
            <div class="ctx-item" data-action="delete"   data-id="${devId}" style="color:#E24B4A;border-top:0.5px solid rgba(255,255,255,0.12);margin-top:4px;padding-top:8px">── Delete</div>
          `;
          ctxMenu.style.left = e.clientX + 'px';
          ctxMenu.style.top  = e.clientY + 'px';
          ctxMenu.style.display = 'block';
        } else {
          ctxMenu.style.display = 'none';
        }
      });

      ctxMenu.addEventListener('click', (e) => {
        e.stopPropagation();
        const item = e.target.closest('.ctx-item');
        if (!item) return;
        const id = parseInt(item.dataset.id);
        if (item.dataset.action === 'delete') {
          deleteDevice(id);
        } else if (item.dataset.action === 'rotate') {
          const dev = window.devices.find(d => d.id === id);
          if (dev) {
            aimingDevice = dev;
            dev.aimQuat = dev.group.quaternion.clone();
            aimPrevMouse = null;
            aimMouseDown = false;
            aimDragMoved = false;
            showAimGizmo(dev);
            controls.enabled = false;
            document.getElementById('aim-hint').style.display = 'block';
          }
        } else if (item.dataset.action === 'resetrot') {
          const dev = window.devices.find(d => d.id === id);
          if (dev) {
            if (dev.baseQuat) {
              dev.group.setRotationFromQuaternion(dev.baseQuat);
            } else {
              dev.group.rotation.set(0, 0, 0);
            }
            dev.group.updateMatrixWorld(true);
            dev.aimQuat = dev.group.quaternion.clone();
            const r = dev.group.rotation;
            dev.rotation = { x: +r.x.toFixed(4), y: +r.y.toFixed(4), z: +r.z.toFixed(4) };
            rebuildFOVFan(dev);
            checkFOVOverlaps(); autoSave();
            showToast('↺ Đã reset xoay', 'info');
          }
        } else if (item.dataset.action === 'height') {
          const dev = window.devices.find(d => d.id === id);
          if (dev) {
            heightAdjDevice = dev;
            controls.enabled = false;
            document.getElementById('height-hint').style.display = 'block';
          }
        } else {
          setStatus(id, item.dataset.action);
        }
        ctxMenu.style.display = 'none';
      });

      document.addEventListener('click', () => { ctxMenu.style.display = 'none'; });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'r' || e.key === 'R') {
          if (aimingDevice !== null) {
            hideAimGizmo();
            aimingDevice = null;
            aimMouseDown = false;
            aimDragMoved = false;
            controls.enabled = true;
            document.getElementById('aim-hint').style.display = 'none';
            renderer.domElement.style.cursor = 'default';
            checkFOVOverlaps(); autoSave();
            return;
          }
          if (hoveredDevice !== null) {
            aimingDevice = hoveredDevice;
            aimingDevice.aimQuat = aimingDevice.group.quaternion.clone();
            aimPrevMouse = null;
            aimMouseDown = false;
            aimDragMoved = false;
            showAimGizmo(aimingDevice);
            controls.enabled = false;
            document.getElementById('aim-hint').style.display = 'block';
            return;
          }
          return;
        }
        if (aimingDevice !== null && (e.key === 'ArrowUp' || e.key === 'ArrowDown' ||
                                      e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
          e.preventDefault();
          const step = e.shiftKey ? 0.01745 : 0.08727; // Shift=1°, thường=5°
          if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
            const sign = e.key === 'ArrowUp' ? -1 : 1;
            const pitchQ = new THREE.Quaternion()
              .setFromAxisAngle(new THREE.Vector3(0, 0, 1), sign * step);
            aimingDevice.aimQuat.multiply(pitchQ);
          } else {
            const sign = e.key === 'ArrowLeft' ? 1 : -1;
            const yawQ = new THREE.Quaternion()
              .setFromAxisAngle(new THREE.Vector3(0, 1, 0), sign * step);
            aimingDevice.aimQuat.premultiply(yawQ);
          }
          aimingDevice.group.quaternion.copy(aimingDevice.aimQuat);
          aimingDevice.group.updateMatrixWorld(true);
          const ra = aimingDevice.group.rotation;
          aimingDevice.rotation = { x: +ra.x.toFixed(4), y: +ra.y.toFixed(4), z: +ra.z.toFixed(4) };
          rebuildFOVFan(aimingDevice);
          updateAimHint(aimingDevice);
          return;
        }
        if (aimingDevice !== null && (e.key === 'q' || e.key === 'Q')) {
          if (!aimingDevice.aimQuat) aimingDevice.aimQuat = aimingDevice.group.quaternion.clone();
          const rQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -0.05);
          aimingDevice.aimQuat.multiply(rQ);
          aimingDevice.group.quaternion.copy(aimingDevice.aimQuat);
          aimingDevice.group.updateMatrixWorld(true);
          const rr = aimingDevice.group.rotation;
          aimingDevice.rotation = { x: +rr.x.toFixed(4), y: +rr.y.toFixed(4), z: +rr.z.toFixed(4) };
          rebuildFOVFan(aimingDevice);
          updateAimHint(aimingDevice);
          return;
        }
        if (aimingDevice !== null && (e.key === 'e' || e.key === 'E')) {
          if (!aimingDevice.aimQuat) aimingDevice.aimQuat = aimingDevice.group.quaternion.clone();
          const rQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), 0.05);
          aimingDevice.aimQuat.multiply(rQ);
          aimingDevice.group.quaternion.copy(aimingDevice.aimQuat);
          aimingDevice.group.updateMatrixWorld(true);
          const rr = aimingDevice.group.rotation;
          aimingDevice.rotation = { x: +rr.x.toFixed(4), y: +rr.y.toFixed(4), z: +rr.z.toFixed(4) };
          rebuildFOVFan(aimingDevice);
          updateAimHint(aimingDevice);
          return;
        }
        if (e.key === 'Escape') {
          if (heightAdjDevice !== null) {
            heightAdjDevice = null;
            controls.enabled = true;
            document.getElementById('height-hint').style.display = 'none';
            renderer.domElement.style.cursor = 'default';
            autoSave();
            return;
          }
          if (aimingDevice !== null) {
            hideAimGizmo();
            aimingDevice = null;
            aimMouseDown = false;
            aimDragMoved = false;
            controls.enabled = true;
            document.getElementById('aim-hint').style.display = 'none';
            renderer.domElement.style.cursor = 'default';
            checkFOVOverlaps(); autoSave();
            return;
          }
          ctxMenu.style.display = 'none';
          if (dragState) { cancelDrag(); return; }
          if (selectedFloor !== null) {
            const prev = window.floors[selectedFloor].slab;
            prev.material.emissive.set(0x000000);
            prev.material.emissiveIntensity = 0;
            selectedFloor = null;
            updateHUD();
          }
        }
      });

      window.addEventListener('blur', () => { if (dragState) cancelDrag(); });


      // ── RENDER LOOP ──
      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        const t = Date.now() / 400;
        window.devices.forEach(d => {
          if (d.status === 'warning') {
            const intensity = 0.35 + 0.35 * Math.sin(t);
            getAllMeshes(d.group).forEach(m => {
              m.material.emissiveIntensity = intensity;
            });
          }
        });
        renderer.render(scene, camera);
        css2dRenderer.render(scene, camera);
      }
      animate();


      // ── TOAST ──
      function showToast(msg, type = 'info') {
        const bg = type === 'success' ? '#0F6E56' : type === 'error' ? '#A32D2D' : '#1e1e2e';
        const pill = document.createElement('div');
        pill.textContent = msg;
        Object.assign(pill.style, {
          background: bg, color: '#fff', fontSize: '12px',
          padding: '7px 16px', borderRadius: '99px',
          opacity: '0', transition: 'opacity 150ms', pointerEvents: 'none',
        });
        document.getElementById('toast-container').appendChild(pill);
        requestAnimationFrame(() => { pill.style.opacity = '1'; });
        setTimeout(() => { pill.style.opacity = '0'; setTimeout(() => pill.remove(), 150); }, 2500);
      }


      // ── SERIALIZATION ──
      function serializeLayout() {
        return JSON.stringify({
          version: 3, floors: FLOORS,
          devices: window.devices.map(d => ({
            id: d.id, typeId: d.typeId, floorIndex: d.floorIndex,
            position: {
              x: +d.group.position.x.toFixed(3),
              y: +d.group.position.y.toFixed(3),
              z: +d.group.position.z.toFixed(3),
            },
            status: d.status,
            heightM:       d.heightM       ?? +(d.group.position.y.toFixed(2)),
            mountType:     d.mountType     ?? 'floor',
            surfaceNormal: d.surfaceNormal ?? null,
            rotation:      d.rotation      ?? { x: 0, y: 0, z: 0 },
            fovDirection:  d.fovDirection  ?? 0,
            fovTilt:       d.fovTilt       ?? 0,
            fovRoll:       d.fovRoll       ?? 0,
            fovQuat: {
              x: +d.group.quaternion.x.toFixed(6), y: +d.group.quaternion.y.toFixed(6),
              z: +d.group.quaternion.z.toFixed(6), w: +d.group.quaternion.w.toFixed(6),
            },
          }))
        });
      }

      function autoSave() { localStorage.setItem('bdm-layout', serializeLayout()); }


      // ── RESTORE ──
      function restoreLayout(data) {
        window.devices.forEach(d => {
          d.group.remove(d.labelObj);
          scene.remove(d.group);
          disposeGroup(d.group);
          if (d.fovMesh) {
            scene.remove(d.fovMesh);
            d.fovMesh.geometry.dispose();
            d.fovMesh.material.dispose();
          }
        });
        window.devices = [];
        window.floors.forEach(f => { f.devices = []; });
        deviceIdCounter = 1;

        let maxId = 0;
        data.devices.forEach(entry => {
          const type = DEVICE_TYPES.find(t => t.id === entry.typeId);
          if (!type || entry.floorIndex < 0 || entry.floorIndex >= FLOORS) return;

          const { group, hitbox } = createDeviceMesh(entry.typeId);
          group.position.set(entry.position.x, entry.position.y, entry.position.z);
          if (entry.rotation) {
            group.rotation.set(entry.rotation.x, entry.rotation.y, entry.rotation.z);
          }
          group.userData = { type: 'device', deviceId: entry.id };
          hitbox.userData = { type: 'device', deviceId: entry.id };
          scene.add(group);

          const labelDiv = document.createElement('div');
          labelDiv.textContent = type.label;
          Object.assign(labelDiv.style, {
            background: 'rgba(0,0,0,0.7)', color: '#fff', fontSize: '10px',
            padding: '2px 6px', borderRadius: '10px',
            borderLeft: `2.5px solid ${type.color}`,
          });
          const labelObj = new CSS2DObject(labelDiv);
          labelObj.position.set(0, 0.55, 0);
          group.add(labelObj);

          const restoredSN = entry.surfaceNormal ?? null;
          const restoredBaseQuat = restoredSN
            ? computeWallRotation(new THREE.Vector3(restoredSN.x, restoredSN.y, restoredSN.z))
            : null;

          const device = {
            id: entry.id, typeId: entry.typeId, floorIndex: entry.floorIndex,
            group, hitbox, labelObj, status: entry.status ?? 'online',
            heightM:       entry.heightM       ?? +(entry.position.y.toFixed(2)),
            mountType:     entry.mountType     ?? 'floor',
            surfaceNormal: restoredSN,
            rotation:      entry.rotation      ?? { x: 0, y: 0, z: 0 },
            fovDirection:  entry.fovDirection  ?? 0,
            fovTilt:       entry.fovTilt       ?? 0,
            fovRoll:       entry.fovRoll       ?? 0,
            baseQuat:      restoredBaseQuat,
          };
          buildFOVCone(device);
          // Nếu có fovQuat (dữ liệu mới) → khôi phục quaternion chính xác
          if (entry.fovQuat) {
            const q = entry.fovQuat;
            device.group.quaternion.set(q.x, q.y, q.z, q.w);
            device.group.updateMatrixWorld(true);
            rebuildFOVFan(device);
          }
          window.devices.push(device);
          window.floors[entry.floorIndex].devices.push(device.id);

          // Apply status visuals
          const s = device.status;
          if (s === 'online')       setGroupEmissive(group, '#1D9E75', 0.4);
          else if (s === 'warning') { setGroupEmissive(group, '#EF9F27', 0.6); }
          else                      { setGroupEmissive(group, '#000000', 0); setGroupOpacity(group, 0.35, true); }

          maxId = Math.max(maxId, entry.id);
        });

        deviceIdCounter = maxId + 1;
        updateSidebar(); updateHUD();
      }


      // ── AUTO-RESTORE ──
      const saved = localStorage.getItem('bdm-layout');
      if (saved) {
        try {
          const data = JSON.parse(saved);
          if (data.version >= 1) {
            restoreLayout(data);
            showToast('Layout restored — ' + data.devices.length + ' devices', 'success');
          }
        } catch(e) { localStorage.removeItem('bdm-layout'); }
      }

    });
  </script>
</head>
<body>
  <div id="drag-cursor"></div>
  <div id="drop-hint"></div>
  <div id="aim-hint" style="position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:rgba(55,138,221,0.92);color:#fff;font-size:13px;font-weight:500;padding:8px 20px;border-radius:99px;z-index:50;pointer-events:none;display:none;box-shadow:0 2px 12px rgba(0,0,0,0.4);">Kéo: xoay | ↑↓: nghiêng | ←→: quay | Q·E/Cuộn: lăn | Shift+phím: chính xác | Click/Esc: xong</div>
  <div id="height-hint" style="position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:rgba(34,197,94,0.9);color:#fff;font-size:12px;padding:7px 18px;border-radius:99px;z-index:50;pointer-events:none;display:none;">Cuộn chuột: tăng/giảm độ cao &nbsp;|&nbsp; Click: xong &nbsp;|&nbsp; Esc: thoát</div>
  <div id="tooltip" style="position:absolute;pointer-events:none;display:none;background:#1e1e2e;border:0.5px solid rgba(255,255,255,0.12);border-radius:8px;padding:0;font-size:12px;color:white;line-height:1.6;z-index:100;overflow:hidden;"></div>
  <div id="ctx-menu" style="position:absolute;display:none;background:#1e1e2e;border:0.5px solid rgba(255,255,255,0.12);border-radius:8px;padding:4px 0;font-size:12px;color:white;z-index:200;min-width:140px;"></div>
  <div id="toast-container" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;"></div>
</body>
</html>
